[versions]
activity = "1.13.0"
androidxTestExtJunit = "1.3.0"
androidxTestRunner = "1.7.0"
androidxCore = "1.19.0"
coil = "3.4.0"
# Coil 3.5.0+ is compiled with Kotlin 2.4, whose metadata our KGP 2.2.10 toolchain cannot read.
# See docs/adr/0004-large-image-strategy.md section 7.2.
composeBom = "2026.09.00"
coroutines = "1.11.0"
javascriptEngine = "1.1.0"
junit4 = "4.13.2"
kotlinxSerialization = "1.11.0"
quickjs = "1.0.5"
# Test-only: android.jar ships org.json stubs, so unit tests that touch the runtime's JSON
# boundaries need a real implementation on the classpath.
json = "20231013"
lifecycle = "2.11.0"
paging = "3.5.1"
navigation3 = "1.1.7"
okhttp = "5.5.0"
room = "2.8.5"
workmanager = "2.11.2"
documentfile = "1.1.0"
# Apache-2.0. Only the SeekableByteChannel constructors are used: see docs/adr/0010.
commonsCompress = "1.28.0"
# Public domain. Needed by commons-compress for LZMA/LZMA2 (7z).
xz = "1.10"

[libraries]
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestExtJunit" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidxCore" }
androidx-javascriptengine = { module = "androidx.javascriptengine:javascriptengine", version.ref = "javascriptEngine" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-paging-common = { module = "androidx.paging:paging-common", version.ref = "paging" }
androidx-paging-compose = { module = "androidx.paging:paging-compose", version.ref = "paging" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-navigation3-runtime = { module = "androidx.navigation3:navigation3-runtime", version.ref = "navigation3" }
androidx-navigation3-ui = { module = "androidx.navigation3:navigation3-ui", version.ref = "navigation3" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
coil-core = { module = "io.coil-kt.coil3:coil-core", version.ref = "coil" }
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
coil-test = { module = "io.coil-kt.coil3:coil-test", version.ref = "coil" }
androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
androidx-room-testing = { module = "androidx.room:room-testing", version.ref = "room" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
# Owned JavaScript engine (ADR-0008). The JVM artifact exists so engine contract tests can run
# without a device; the version is pinned deliberately and is upgraded only with contract tests.
quickjs-kt = { module = "io.github.dokar3:quickjs-kt", version.ref = "quickjs" }
quickjs-kt-jvm = { module = "io.github.dokar3:quickjs-kt-jvm", version.ref = "quickjs" }
json = { module = "org.json:json", version.ref = "json" }
junit4 = { module = "junit:junit", version.ref = "junit4" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-mockwebserver = { module = "com.squareup.okhttp3:mockwebserver3", version.ref = "okhttp" }
androidx-work-runtime-ktx = { module = "androidx.work:work-runtime-ktx", version.ref = "workmanager" }
androidx-work-testing = { module = "androidx.work:work-testing", version.ref = "workmanager" }
androidx-documentfile = { module = "androidx.documentfile:documentfile", version.ref = "documentfile" }
commons-compress = { module = "org.apache.commons:commons-compress", version.ref = "commonsCompress" }
xz = { module = "org.tukaani:xz", version.ref = "xz" }
